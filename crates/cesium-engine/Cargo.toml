[package]
name = "cesium-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22.0"
glam = "0.27"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "charset", "http2"] }
image = "0.25"
# Offline SVG vector tile rendering — pure Rust, zero C deps, Android-safe.
# usvg parses the map once; tiles are drawn with tiny-skia directly (see
# svg_renderer.rs for why not resvg). We opt-out of system-fonts, text,
# raster-images and svgz: the world map SVG has no text, no raster fills and no
# embedded images, and it is un-gzipped with flate2 (already in the tree via
# reqwest's gzip). tiny-skia is already in the tree via winit/sctk-adwaita.
usvg = { version = "0.48", default-features = false }
flate2 = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
log = "0.4"
cfg-if = "1.0"
egui = { version = "0.29.0", optional = true }
egui-wgpu = { version = "0.29.0", optional = true }
egui-winit = { version = "0.29.0", optional = true }
lru = "0.12"
rayon = "1.10"
async-trait = "0.1.89"
byteorder = "1.5.0"
sha2 = "0.11.0"
gltf = "1.4.1"
# Label text: rasterized from egui's default proportional face so the labels look as
# they did when egui drew them. Both were already in the tree via egui.
ab_glyph = "0.2"
epaint_default_fonts = "0.29"
winit = { version = "0.30", features = ["rwh_06"] }
libc = "0.2"


[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["api-level-23"], optional = true }

[features]
testing = []
debug_panel = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Android ATrace spans for on-device CPU profiling (see src/core/trace.rs). No-op
# on non-Android targets even when enabled; adds the `ndk` dependency only when on.
perf_trace = ["dep:ndk"]
